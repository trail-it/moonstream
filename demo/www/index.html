<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonStream 离线演示：逐字段消费流式 tool-call 参数</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: #d0d7de;
        --muted: #57606a;
        --ok: #1a7f37;
        --warn: #9a6700;
        --bad: #cf222e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.5rem;
        font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        max-width: 1100px;
        margin-inline: auto;
      }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
      p.lede { color: var(--muted); margin: 0 0 1.25rem; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      button, select {
        font: inherit;
        padding: .35rem .75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
      section {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: .75rem 1rem;
      }
      section h2 {
        font-size: .8rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
        margin: 0 0 .5rem;
      }
      code, pre, #preview, #raw {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
      }
      #preview, #raw {
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 3.5em;
        margin: 0;
      }
      #log {
        margin: 0;
        padding-left: 1.1rem;
        max-height: 16rem;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12.5px;
      }
      #log li { margin-bottom: .15rem; }
      #status { font-weight: 600; }
      #status[data-status="complete"] { color: var(--ok); }
      #status[data-status="incomplete"],
      #status[data-status="aborted"] { color: var(--warn); }
      #status[data-status="error"] { color: var(--bad); }
      .meta { color: var(--muted); font-size: .85rem; }
    </style>
  </head>
  <body>
    <h1>MoonStream 离线演示</h1>
    <p class="lede">
      同一段 LLM tool-call 参数流，按固定字节大小分块喂入。
      <strong>左侧</strong>是「等整段 JSON 再解析」的应用能看到的东西；
      <strong>右侧</strong>是 MoonStream 逐字段交付的预览与事件。
      解析、状态判断与这里的每个字段都由 MoonBit（wasm-gc）计算，页面只负责绘制。
    </p>

    <div class="controls">
      <button id="step">步进一块</button>
      <button id="play">自动播放</button>
      <button id="reset">重来</button>
      <button id="truncate">模拟截断</button>
      <label class="meta">
        分块大小
        <select id="chunk-size">
          <option value="1">1 字节</option>
          <option value="4">4 字节</option>
          <option value="8" selected>8 字节</option>
          <option value="16">16 字节</option>
          <option value="64">64 字节</option>
        </select>
      </label>
      <span class="meta">进度 <span id="progress">0 / 0</span></span>
      <span class="meta">状态 <span id="status" data-status="parsing">解析中</span></span>
    </div>

    <div class="grid">
      <section>
        <h2>等整段 JSON（对照）</h2>
        <div id="raw">（等待完整 JSON…）</div>
      </section>
      <section>
        <h2>MoonStream 部分树预览</h2>
        <div id="preview"></div>
      </section>
      <section>
        <h2>本块内容</h2>
        <div id="chunk" class="meta"></div>
      </section>
      <section>
        <h2>结构事件（最近 14 条）</h2>
        <ol id="log"></ol>
      </section>
    </div>

    <p class="meta" id="result"></p>

    <script type="module">
      import { loadDemoFromUrl } from "./host.js";
      import { mount } from "./ui.js";

      const demo = await loadDemoFromUrl("./moonstream_demo.wasm");
      mount(demo);
    </script>
  </body>
</html>
